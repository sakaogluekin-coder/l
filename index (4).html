<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LAVENDER AI v3.0 ULTRA</title>
  
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      background: #030712;
      color: #38bdf8;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-top: 4px;
      width: 100%;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: #a855f7;
      text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
    }

    .subtitle {
      font-size: 0.65rem;
      color: #38bdf8;
      letter-spacing: 2px;
      margin-top: 2px;
    }

    .control-panel {
      width: 100%;
      max-width: 420px;
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .api-input, .select-input, .text-msg-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      padding: 8px 10px;
      color: #e9d5ff;
      font-size: 0.75rem;
      outline: none;
      user-select: text;
    }

    .btn {
      background: #9333ea;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: #0284c7;
    }

    .clear-btn {
      background: #ef4444;
    }

    .sub-box {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      background: rgba(15, 23, 42, 0.9);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #a855f7;
    }

    .textarea-custom {
      width: 100%;
      height: 70px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #a855f7;
      border-radius: 8px;
      padding: 8px;
      color: #e9d5ff;
      font-size: 0.75rem;
      resize: none;
      outline: none;
      user-select: text;
    }

    .core-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      cursor: pointer;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .ring-outer {
      width: 140px;
      height: 140px;
      border-top-color: #a855f7;
      border-bottom-color: #38bdf8;
      animation: spin 3s linear infinite;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    .ring-inner {
      width: 95px;
      height: 95px;
      border-left-color: #a855f7;
      border-right-color: #38bdf8;
      animation: spin-reverse 2s linear infinite;
    }

    .core-center {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #a855f7 0%, #030712 70%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 30px #a855f7;
      transition: all 0.3s;
      text-align: center;
    }

    .core-container.listening .ring-outer {
      border-top-color: #ef4444;
      border-bottom-color: #ef4444;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
    }

    .core-container.listening .core-center {
      background: radial-gradient(circle, #ef4444 0%, #030712 70%);
      box-shadow: 0 0 35px #ef4444;
    }

    .core-container.thinking .ring-outer {
      border-top-color: #eab308;
      border-bottom-color: #eab308;
      animation-duration: 1s;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .preview-img {
      max-width: 100%;
      max-height: 80px;
      border-radius: 6px;
      display: none;
      margin-top: 4px;
      object-fit: cover;
    }

    .chat-box {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      max-height: 160px;
      overflow-y: auto;
    }

    .msg-label {
      font-size: 0.65rem;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .user-msg {
      font-size: 0.85rem;
      color: #f8fafc;
      min-height: 18px;
      user-select: text;
    }

    .jarvis-msg {
      font-size: 0.85rem;
      color: #c084fc;
      font-weight: 600;
      min-height: 22px;
      line-height: 1.3;
      user-select: text;
    }

    .text-input-area {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .status-bar {
      font-size: 0.7rem;
      color: #e9d5ff;
      text-align: center;
      margin-top: 6px;
      padding: 6px 10px;
      background: rgba(147, 51, 234, 0.2);
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(168, 85, 247, 0.2);
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">LAVENDER</div>
    <div class="subtitle">AI NEURAL NETWORK v3.0 ULTRA</div>
  </header>

  <div class="control-panel">
    <input type="password" id="api-key" class="api-input" placeholder="Groq API Key Yapıştırın" />
    <button class="btn" onclick="saveApiKey()">Kaydet</button>
    <button class="btn btn-secondary" onclick="toggleBox('image-box')">📷 Görsel</button>
    <button class="btn btn-secondary" onclick="toggleBox('settings-box')">⚙️ Ayarlar</button>
    <button class="btn clear-btn" onclick="clearMemory()">Temizle</button>
  </div>

  <div class="sub-box" id="image-box">
    <input type="file" id="image-input" accept="image/*" onchange="handleImageSelect(event)" style="color: #e9d5ff; font-size: 0.75rem;">
    <img id="image-preview" class="preview-img" alt="Yüklenen Görsel">
    <button class="btn clear-btn" onclick="removeImage()">Görseli Kaldır</button>
  </div>

  <div class="sub-box" id="settings-box">
    <label style="font-size:0.7rem; color:#a855f7;">Ses Seçimi (TTS):</label>
    <select id="voice-select" class="select-input" onchange="saveVoicePreference()"></select>

    <label style="font-size:0.7rem; color:#a855f7; margin-top:4px;">Ders Programı:</label>
    <textarea id="schedule-input" class="textarea-custom" placeholder="Pazartesi: Matematik..."></textarea>
    <button class="btn" onclick="saveSchedule()">Programı Kaydet</button>
  </div>

  <div class="core-container" id="core-btn" onclick="startListening()">
    <div class="ring ring-outer"></div>
    <div class="ring ring-inner"></div>
    <div class="core-center" id="core-text">DOKUN<br>KONUŞ</div>
  </div>

  <div class="chat-box">
    <div>
      <div class="msg-label">SEN:</div>
      <div class="user-msg" id="user-speech">Konuşun veya aşağıdan yazın...</div>
    </div>
    <hr style="border: 0; border-top: 1px solid rgba(168, 85, 247, 0.2);">
    <div>
      <div class="msg-label">LAVENDER:</div>
      <div class="jarvis-msg" id="jarvis-reply">Sistemler aktif, sizi dinliyorum Efendim.</div>
    </div>
  </div>

  <div class="text-input-area">
    <input type="text" id="text-input" class="text-msg-input" placeholder="Mesajınızı yazın..." onkeydown="handleKeyPress(event)" />
    <button class="btn" onclick="sendTextMessage()">Gönder</button>
  </div>

  <div class="status-bar" id="status-text">
    ⚡ Lavender v3.0 Hazır!
  </div>

  <script>
    const userSpeechEl = document.getElementById("user-speech");
    const jarvisReplyEl = document.getElementById("jarvis-reply");
    const coreBtn = document.getElementById("core-btn");
    const coreText = document.getElementById("core-text");
    const apiKeyInput = document.getElementById("api-key");
    const statusText = document.getElementById("status-text");
    const scheduleInput = document.getElementById("schedule-input");
    const voiceSelect = document.getElementById("voice-select");
    const imagePreview = document.getElementById("image-preview");
    const textInput = document.getElementById("text-input");

    const DEFAULT_API_KEY = "";

    let apiKey = localStorage.getItem("jarvis_groq_key") || DEFAULT_API_KEY;

    let chatHistory = JSON.parse(localStorage.getItem("lavender_chat_history") || "[]");
    let userSchedule = localStorage.getItem("lavender_schedule") || "Henüz girilmedi.";
    let selectedVoiceIndex = localStorage.getItem("lavender_voice_index") || 0;
    let currentBase64Image = null;
    let voices = [];

    if (apiKey) apiKeyInput.value = apiKey;
    if (userSchedule !== "Henüz girilmedi.") scheduleInput.value = userSchedule;

    function populateVoiceList() {
      if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        voiceSelect.innerHTML = '';
        voices.forEach((voice, i) => {
          const option = document.createElement('option');
          option.textContent = `${voice.name} (${voice.lang})`;
          option.value = i;
          if (voice.lang.includes('tr')) option.selected = true;
          voiceSelect.appendChild(option);
        });
        if (selectedVoiceIndex && voices[selectedVoiceIndex]) {
          voiceSelect.value = selectedVoiceIndex;
        }
      }
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function saveVoicePreference() {
      selectedVoiceIndex = voiceSelect.value;
      localStorage.setItem("lavender_voice_index", selectedVoiceIndex);
      statusText.innerText = "🔊 Ses tercihi kaydedildi!";
    }

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem("jarvis_groq_key", key);
        apiKey = key;
        statusText.innerText = "⚡ API Key Kaydedildi!";
      }
    }

    function toggleBox(id) {
      const el = document.getElementById(id);
      el.style.display = el.style.display === "flex" ? "none" : "flex";
    }

    function saveSchedule() {
      const val = scheduleInput.value.trim();
      if (val) {
        localStorage.setItem("lavender_schedule", val);
        userSchedule = val;
        statusText.innerText = "📅 Ders programı kaydedildi!";
      }
    }

    function clearMemory() {
      localStorage.removeItem("lavender_chat_history");
      chatHistory = [];
      statusText.innerText = "🧹 Konuşma hafızası temizlendi!";
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentBase64Image = e.target.result;
          imagePreview.src = currentBase64Image;
          imagePreview.style.display = "block";
          statusText.innerText = "📷 Görsel yüklendi, analiz etmeye hazır!";
        };
        reader.readAsDataURL(file);
      }
    }

    function removeImage() {
      currentBase64Image = null;
      imagePreview.style.display = "none";
      document.getElementById("image-input").value = "";
      statusText.innerText = "📷 Görsel kaldırıldı.";
    }

    function sendTextMessage() {
      const query = textInput.value.trim();
      if (query !== "") {
        userSpeechEl.innerText = `"${query}"`;
        textInput.value = "";
        handleUserRequest(query);
      }
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendTextMessage();
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        coreBtn.className = "core-container listening";
        coreText.innerHTML = "DİNLİYOR...";
        userSpeechEl.innerText = "Sizi dinliyorum Efendim...";
      };

      recognition.onend = () => {
        if (!coreBtn.classList.contains("thinking")) {
          coreBtn.className = "core-container";
          coreText.innerHTML = "DOKUN<br>KONUŞ";
        }
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userSpeechEl.innerText = `"${transcript}"`;
        handleUserRequest(transcript);
      };

      recognition.onerror = () => {
        speak("Sizi tam anlayamadım Efendim.");
        coreBtn.className = "core-container";
        coreText.innerHTML = "DOKUN<br>KONUŞ";
      };
    }

    function speak(text) {
      jarvisReplyEl.innerText = text;
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (voices[voiceSelect.value]) {
          utterance.voice = voices[voiceSelect.value];
        } else {
          utterance.lang = 'tr-TR';
        }
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    async function fetchExternalContext(query) {
      let context = "";
      const lowerQuery = query.toLowerCase();

      if (lowerQuery.includes("hava durumu") || lowerQuery.includes("hava nasıl")) {
        try {
          const res = await fetch("https://wttr.in/Istanbul?format=j1");
          if (res.ok) {
            const data = await res.json();
            const current = data.current_condition[0];
            context += `\n[Canlı Hava Durumu Bilgisi: İstanbul Sıcaklık ${current.temp_C}°C, Durum: ${current.lang_tr ? current.lang_tr[0].value : current.weatherDesc[0].value}]`;
          }
        } catch(e) {}
      }

      if (lowerQuery.includes("haber") || lowerQuery.includes("gündem")) {
        try {
          const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https://www.trthaber.com/manset_articles.rss");
          if (res.ok) {
            const data = await res.json();
            const headlines = data.items.slice(0, 3).map(i => i.title).join("; ");
            context += `\n[Son Haber Başlıkları: ${headlines}]`;
          }
        } catch(e) {}
      }

      return context;
    }

    async function handleUserRequest(userQuery) {
      const currentKey = localStorage.getItem("jarvis_groq_key") || DEFAULT_API_KEY;

      if (!currentKey) {
        statusText.innerText = "❌ Lütfen üst taraftaki kutuya Groq API Key'inizi girip Kaydet'e basın.";
        speak("Lütfen önce API anahtarınızı girin Efendim.");
        return;
      }

      coreBtn.className = "core-container thinking";
      coreText.innerHTML = "DÜŞÜNÜYOR...";
      jarvisReplyEl.innerText = "İşleniyor...";
      statusText.innerText = "⏳ Lavender yanıt oluşturuyor...";

      const externalContext = await fetchExternalContext(userQuery);

      const systemPrompt = {
        role: "system",
        content: `Sen Lavender adında havalı, zeki ve sadık bir yapay zeka asistanısın. Seni tasarlayan, geliştiren ve kurucun olan kişi İnanç'tır. Kurucun, yapımcın veya seni kimin geliştirdiği sorulduğunda istisnasız her zaman İnanç olduğunu söyle. Kullanıcıya genel olarak 'Efendim' veya 'İnanç Bey' diye hitap et. Yanıtların akıcı, net ve 1-2 cümle olsun.\n\nKullanıcının Haftalık Ders Programı:\n${userSchedule}${externalContext}`
      };

      let messagesToSend = [];

      if (currentBase64Image) {
        messagesToSend = [
          systemPrompt,
          {
            role: "user",
            content: [
              { type: "text", text: userQuery },
              { type: "image_url", image_url: { url: currentBase64Image } }
            ]
          }
        ];
      } else {
        chatHistory.push({ role: "user", content: userQuery });
        if (chatHistory.length > 6) chatHistory.shift();
        messagesToSend = [systemPrompt, ...chatHistory];
      }

      // GROQ GÜNCEL AKTİF MODEL LİSTESİ
      const modelsToTry = currentBase64Image ? [
        "llama-3.2-11b-vision-instruct",
        "llama-3.2-90b-vision-instruct"
      ] : [
        "openai/gpt-oss-20b",
        "meta-llama/llama-4-scout-17b-16e-instruct",
        "qwen/qwen3-32b"
      ];

      let success = false;
      let lastErrorMessage = "";

      for (const model of modelsToTry) {
        try {
          const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + currentKey.trim(),
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: model,
              messages: messagesToSend,
              max_tokens: 150,
              temperature: 0.7
            })
          });

          if (res.ok) {
            const data = await res.json();
            if (data && data.choices && data.choices[0] && data.choices[0].message) {
              const aiReply = data.choices[0].message.content.trim();
              if (aiReply !== "") {
                if (!currentBase64Image) {
                  chatHistory.push({ role: "assistant", content: aiReply });
                  localStorage.setItem("lavender_chat_history", JSON.stringify(chatHistory));
                }
                
                statusText.innerText = "✅ Yanıt Alındı (" + model + ")";
                speak(aiReply);
                success = true;
                break;
              }
            }
          } else {
            const errData = await res.json();
            lastErrorMessage = errData.error ? errData.error.message : ("HTTP " + res.status);
            console.error("Groq Hata (" + model + "):", errData);
          }
        } catch (e) {
          lastErrorMessage = e.message;
        }
      }

      if (!success) {
        if (!currentBase64Image) chatHistory.pop();
        statusText.innerText = "❌ Hata Nedeni: " + lastErrorMessage;
        speak("Üzgünüm İnanç Bey, model yanıt vermedi.");
      }

      coreBtn.className = "core-container";
      coreText.innerHTML = "DOKUN<br>KONUŞ";
    }

    function startListening() {
      if (recognition) {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    }
  </script>
</body>
</html>
